<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>杉昱運命行館 - 金流分期計算系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* iOS Form Select Reset */
        select, input {
            -webkit-appearance: none;
            appearance: none;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 space-y-6 border border-slate-200/60">
        <!-- Header -->
        <div class="text-center space-y-1">
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">杉昱運命行館</h1>
            <p class="text-xs text-slate-500 font-medium">金流分期計算系統 (PAYUNi 標準)</p>
        </div>

        <!-- Inputs -->
        <div class="space-y-4">
            <!-- Price Input -->
            <div>
                <label for="originPrice" class="block text-sm font-semibold text-slate-700 mb-1">1. 輸入基礎原價</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 font-medium text-sm">NT$</span>
                    <input type="number" id="originPrice" value="49800" min="0" oninput="calculate()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-xl focus:ring-2 focus:ring-slate-700 focus:border-slate-700 block p-3 pl-12 transition font-semibold">
                </div>
            </div>

            <!-- Installment Terms -->
            <div>
                <label for="installmentTerm" class="block text-sm font-semibold text-slate-700 mb-1">2. 選擇分期期數</label>
                <div class="relative">
                    <select id="installmentTerm" onchange="calculate()" class="w-full bg-slate-50 border border-slate-300 text-slate-900 text-base rounded-xl focus:ring-2 focus:ring-slate-700 focus:border-slate-700 block p-3 pr-8 transition font-medium">
                        <option value="3">單筆付清 & 3期</option>
                        <option value="6">6期</option>
                        <option value="9">9期</option>
                        <option value="12">12期</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Result Box -->
        <div class="bg-amber-50/80 border border-amber-200/80 rounded-xl p-4 space-y-1">
            <span class="text-xs font-bold text-amber-800 tracking-wide uppercase">顧客最終需刷卡金額</span>
            <div class="text-3xl font-extrabold text-amber-900">NT$ <span id="customerTotal">0</span></div>
        </div>

        <!-- Schedule List -->
        <div class="space-y-3 pt-2 border-t border-slate-200/80">
            <h2 class="text-sm font-bold text-slate-700 flex items-center gap-1.5">
                <span>📋 每一期繳款金額明細</span>
            </h2>
            <ul id="scheduleList" class="divide-y divide-slate-100 text-sm font-medium"></ul>
        </div>
    </div>

    <script>
        const feeRates = {
            "3": 0.025,
            "6": 0.035,
            "9": 0.040,
            "12": 0.065
        };

        function calculate() {
            const originPrice = parseFloat(document.getElementById("originPrice").value) || 0;
            const term = document.getElementById("installmentTerm").value;
            const currentRate = feeRates[term];

            // 3期實收利潤為基準：淨收 = 原價 * (1 - 2.5%)
            const baseProfit = originPrice * (1 - 0.025);

            let customerTotal = 0;
            if (term === "3") {
                customerTotal = originPrice;
            } else {
                // 逆算公式：應刷總價 = 淨收 / (1 - 當期費率)
                customerTotal = Math.round(baseProfit / (1 - currentRate));
            }

            document.getElementById("customerTotal").innerText = customerTotal.toLocaleString();

            const termCount = parseInt(term);
            const basePerTerm = Math.floor(customerTotal / termCount);
            const residual = customerTotal - (basePerTerm * termCount);
            const firstTermAmount = basePerTerm + residual;

            const listContainer = document.getElementById("scheduleList");
            let listHtml = "";

            for (let i = 1; i <= termCount; i++) {
                if (i === 1) {
                    listHtml += `
                        <li class="py-2.5 px-3 bg-emerald-50 text-emerald-900 rounded-lg flex justify-between items-center font-semibold mb-1">
                            <span class="flex items-center gap-1.5">
                                第 1 期 (含餘數)
                            </span>
                            <span>NT$ ${firstTermAmount.toLocaleString()} ${residual > 0 ? `<span class="bg-emerald-600 text-white text-[10px] px-1.5 py-0.5 rounded font-normal ml-1">+${residual} 餘數</span>` : ''}</span>
                        </li>`;
                } else {
                    listHtml += `
                        <li class="py-2.5 px-3 flex justify-between items-center text-slate-600">
                            <span>第 ${i} 期</span>
                            <span class="font-semibold text-slate-800">NT$ ${basePerTerm.toLocaleString()}</span>
                        </li>`;
                }
            }
            listContainer.innerHTML = listHtml;
        }

        window.onload = function() {
            calculate();
        };
    </script>
</body>
</html>
